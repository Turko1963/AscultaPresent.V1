<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCULTA AI · Presentation (phone)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232EC4B6'/%3E%3Cpath d='M5 10.5v3M8.5 7v10M12 4.5v15M15.5 8v8M19 10.5v3' stroke='%2307152E' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('asc-theme'))||'dark'}catch(e){}</script>
<style>
body{background:var(--navy-deep);color:#fff;background-image:none}
.m{max-width:560px;margin:0 auto;padding:0 18px 90px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 18px;margin:0 -18px;background:rgba(7,21,46,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
.top .brand{padding:0}.top .brand-mk{width:30px;height:30px;border-radius:9px}
.top .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7488AB}
.pg{height:2px;background:var(--teal);position:fixed;top:0;left:0;z-index:30;width:0}
.s{padding:44px 0 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--teal);font-weight:700;text-transform:uppercase}
.s h1{font-size:52px;letter-spacing:-.04em;line-height:.95;margin-top:16px}
.s h1 span,.s h2 em{color:var(--teal);font-style:normal;display:block}
.s h2{font-size:32px;letter-spacing:-.03em;margin-top:8px;line-height:1.05}
.s .tag{font-family:var(--display);color:#A9BAD6;font-size:18px;margin-top:6px}
.s p.lead{color:#A9BAD6;font-size:16px;margin-top:14px}
.ph{margin-top:18px;border-radius:16px;overflow:hidden;background:#06122A;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 20px 40px rgba(0,0,0,.4)}
.ph .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#7488AB;border-bottom:1px solid rgba(255,255,255,.08)}
.ph .vp{position:relative;aspect-ratio:16/10;overflow:hidden}
.ph iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.ph .open{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px;background:linear-gradient(transparent 60%,rgba(4,12,28,.6))}
ul.n{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:16px}
ul.n li{display:flex;gap:10px;font-size:15px;color:#D6E0EF}
ul.n li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none;margin-top:8px}
.pr{display:grid;gap:10px;margin-top:18px}
.pr div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px}
.pr b{font-family:var(--display);font-size:18px;display:block}.pr p{font-size:14px;color:#A9BAD6;margin-top:2px}
.pr small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--teal)}
.jr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.jr a{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px}
.jr span{font-family:var(--display);font-weight:800;color:var(--teal);font-size:20px;display:block}
.jr b{font-size:14px}
video{width:100%;border-radius:16px;margin-top:18px;background:#000}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.fab{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:8px}
.fab button{width:46px;height:46px;border-radius:50%;background:var(--teal);color:#07152E;font-weight:900;font-size:18px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.fab button.g{background:#16305E;color:#fff}
</style>
</head>
<body>
<i class="pg" id="pg"></i>
<div class="m">
 <header class="top"><a class="brand" href="index.html"><span class="brand-mk" id="bm"></span><span class="brand-tx">ASCULTA <b>AI</b></span></a><span class="cnt" id="cnt">01</span></header>
 <div id="deck"></div>
</div>
<div class="fab"><button class="g" id="up" aria-label="Previous">↑</button><button id="dn" aria-label="Next">↓</button></div>
<script src="assets/deck.js"></script>
<script>
(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
$('#bm').innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>';
const S=DECK.screens;let h='';
h+=`<section class="s"><p class="k">Design review · November 2026</p><h1>Every conversation,<span>heard.</span></h1><p class="lead">The ASCULTA AI hub: ${S.length} screens for managers, team leads and agents. Tap any screen to open it live.</p><div class="btns"><a class="btn pri" href="index.html">Open the live demo</a><a class="btn gh" style="color:#fff;border-color:rgba(255,255,255,.3)" href="presentation.html">Big-screen version</a></div></section>`;
h+=`<section class="s"><p class="k">The idea</p><h2>Listen to everything.<em>Show only what matters.</em></h2><div class="pr"><div><small>CALM</small><b>Navy by default</b><p>Colour appears only when it carries a meaning.</p></div><div><small>SIGNAL</small><b>Teal helps, red protects</b><p>Teal is coaching and progress. Red is risk, and nothing else.</p></div><div><small>ANSWERS FIRST</small><b>One sentence, then detail</b><p>Every manager screen opens with the ASCULTA brief.</p></div><div><small>COVERAGE</small><b>Every call, not a sample</b><p>Every number links back to the moment it was said.</p></div></div></section>`;
h+=`<section class="s"><p class="k">The journey</p><h2>From the first click<em>to the agent's next word.</em></h2><div class="jr">${S.map((s,i)=>`<a href="#s${i}"><span>${String(i+1).padStart(2,'0')}</span><b>${s.n}</b></a>`).join('')}</div></section>`;
S.forEach((s,i)=>{const u=s.url+(s.url.includes('?')?'&':'?')+(s.url.includes('role=')?'':'role='+s.role+'&')+'embed=1';
 h+=`<section class="s" id="s${i}"><p class="k">${String(i+1).padStart(2,'0')} / ${S.length} · ${s.who}</p><h2>${s.n}</h2><p class="tag">${s.tag}</p>
 <a class="ph" href="${u}" style="display:block"><div class="bar"><i class="dot pulse" style="background:var(--teal);width:6px;height:6px;border-radius:50%"></i>LIVE · TAP TO OPEN</div><div class="vp"><iframe data-src="${u}" title="${s.n}" tabindex="-1"></iframe><span class="open"><span class="btn sm pri">Open ${s.n} ↗</span></span></div></a>
 <ul class="n">${s.news.map(n=>`<li>${n}</li>`).join('')}</ul></section>`});
h+=`<section class="s"><p class="k">The sample video</p><h2>53 seconds,<em>start to finish.</em></h2><video src="assets/asculta-sample-video.mp4" poster="assets/video-poster.jpg" controls playsinline preload="metadata"></video></section>`;
h+=`<section class="s"><p class="k">What's next</p><h2>A free 1-week pilot<em>in your own call center.</em></h2><div class="pr"><div><small>DAY 1</small><b>Kick-off &amp; setup</b><p>Scope, teams, data access and security.</p></div><div><small>DAYS 2–6</small><b>Live analysis</b><p>Your real sales and retention conversations.</p></div><div><small>DAY 7</small><b>Results review</b><p>A clear decision point.</p></div></div><div class="btns"><a class="btn pri" href="index.html">Open the live demo</a><a class="btn gh" style="color:#fff;border-color:rgba(255,255,255,.3)" href="../briefing.html">Executive briefing</a><a class="btn gh" style="color:#fff;border-color:rgba(255,255,255,.3)" href="assets/ASCULTA_AI_CTO_Briefing.pptx">CTO briefing (.pptx)</a></div></section>`;
$('#deck').innerHTML=h;
const fit=()=>$$('.vp').forEach(v=>{$('iframe',v).style.transform=`scale(${v.clientWidth/1440})`});fit();addEventListener('resize',fit);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const f=e.target;if(!f.src)f.src=f.dataset.src;io.unobserve(f)}}),{rootMargin:'300px'});$$('iframe').forEach(f=>io.observe(f));
const secs=$$('.s');const cur=()=>{let c=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.4)c=i});return c};
addEventListener('scroll',()=>{const m=document.documentElement;$('#pg').style.width=(m.scrollTop/(m.scrollHeight-m.clientHeight)*100)+'%';$('#cnt').textContent=String(cur()+1).padStart(2,'0')+' / '+secs.length},{passive:true});
$('#dn').onclick=()=>{const n=secs[Math.min(secs.length-1,cur()+1)];n.scrollIntoView({behavior:'smooth'})};$('#up').onclick=()=>{secs[Math.max(0,cur()-1)].scrollIntoView({behavior:'smooth'})};
$('#cnt').textContent='01 / '+secs.length;
})();
</script>
</body>
</html>
